name: Build tweak
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/l1ghtmann/theos:latest   # Theos + toolchain + SDKs preinstalled
    steps:
      - uses: actions/checkout@v4
      - name: Build package
        run: |
          export THEOS=/theos
          make package FINALPACKAGE=1
      - uses: actions/upload-artifact@v4
        with:
          name: gsa-logger-deb
          path: packages/*.deb
          if-no-files-found: error
