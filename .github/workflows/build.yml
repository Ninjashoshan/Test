name: Build tweak
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Randomblock1/theos-action@main
      - name: Build
        run: |
          make package FINALPACKAGE=1
      - uses: actions/upload-artifact@v4
        with:
          name: gsa-logger-deb
          path: packages/*.deb
          if-no-files-found: error
